<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Zoom Transcript — Control</title>
    <style>
    body { font-family: Arial, sans-serif; width:300px; padding:12px; }
    label { display:block; margin-top:8px; font-size:13px; color:#333; }
    input[type="text"] { width:100%; padding:8px; margin-top:6px; box-sizing:border-box; }
    .row { display:flex; gap:8px; margin-top:12px; }
    button { flex:1; padding:8px; border-radius:6px; cursor:pointer; }
    #status { margin-top:10px; font-size:13px; color:#555; }
    small { color:#666; display:block; margin-top:8px; }
  </style>
  </head>
  <body>
    <h4>Zoom Transcript Capture</h4>
    <label>Server URL</label>
    <input id="serverUrl" placeholder="http://localhost:8000" />
     <div class="row">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="downloadBtn">Download Buffer</button>
    </div>
    <div id="status">Idle</div>
  <small>Click Start to open the UI and begin capturing in the active Zoom web tab.</small>
    <script src="popup.js"></script>
  </body>
</html>
